<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASH</title>
    <style>
        body {
            background-color: black;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            position: relative;
            flex-direction: column;
        }

        h1 {
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 6em;
            position: relative;
            animation: shine 2s infinite alternate;
        }

        @keyframes shine {
            to {
                text-shadow: 0 0 20px rgba(255, 255, 255, 0.8), 0 0 40px rgba(255, 255, 255, 0.8), 0 0 60px rgba(255, 255, 255, 0.8);
                filter: blur(10px);
            }
        }

        .contact {
            position: absolute;
            bottom: 20px;
            color: #666;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 0.8em;
            text-align: center;
            width: 100%;
        }

        .contact a {
            color: #666;
            text-decoration: none;
        }

        .contact a:hover {
            color: #666;
            transform: none;
        }
    </style>
</head>
<body>
    <h1>ASH</h1>
    <div class="contact">
        <a href="contact.html">Contact</a>
    </div>
</body>
</html>
